[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nesting2d"
version = "0.1.0"
description = "Nesting 2D de piezas importadas de PDF vectorial o DXF sobre planchas"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",   # MIT - lectura de PDF
    "shapely>=2.0",       # BSD-3 - geometría
    "ezdxf>=1.1",         # MIT - DXF
    "spyrrow==0.9.0",     # MIT - motor de nesting (versión fijada: API 0.x)
    "opencv-python-headless>=4.8,<6",  # Apache 2.0 - vectorizar capturas y escaneos (probado con 5.0)
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
gui = ["PySide6>=6.6"]   # LGPL - interfaz

[project.gui-scripts]
nesting2d-gui = "nesting2d.gui.app:main"

[tool.setuptools.packages.find]
include = ["nesting2d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
